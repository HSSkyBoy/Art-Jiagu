name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android build tools
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Run checks and build APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Verify APK archives and native libraries
        run: |
          for apk in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          do
            unzip -t "$apk" >/dev/null
            for abi in armeabi-v7a arm64-v8a x86 x86_64
            do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libArkStub.so"
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libArkTool.so"
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libzipalign.so"
            done
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: ark-jiagu-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v6
        with:
          name: ark-jiagu-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
